<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fairuz Faiyaz, system simulation engineer. I don't just write code, I model reality, in C++. Core C++, memory management, discrete-event simulation, and concurrency. Currently researching multi-threading, discrete-event simulation, and heap/stack optimization. Stats: 4 simulation engines, C++17/STL, queueing theory, priority scheduling, custom file I/O.">
  <desc>Animated hero card: a pulse travels the divider line and three research topics crossfade in sequence; all headline content is static and readable on the first frame.</desc>
  <defs>
    <pattern id="gridPaper" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="bgGlow" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#004e92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <path id="dividerPath" d="M 60,246 L 1140,246"/>
  </defs>

  <rect width="1200" height="500" fill="#0b0e14"/>
  <rect width="1200" height="500" fill="url(#gridPaper)"/>
  <rect width="1200" height="500" fill="url(#bgGlow)"/>

  <!-- kicker -->
  <text x="60" y="56" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.5" fill="#67e8f9">FAIRUZ FAIYAZ — SYSTEM SIMULATION ENGINEER</text>
  <text x="1140" y="56" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.5" fill="#71717a">AIUB · CSE · B.SC IN PROGRESS</text>

  <!-- tagline -->
  <text x="60" y="132" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="52" font-weight="800" fill="#e9edf3">I don't just write code<tspan fill="#22d3ee">.</tspan></text>

  <!-- subheadline -->
  <text x="60" y="174" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="23" font-weight="600" fill="#c9d1d9">I <tspan fill="#67e8f9" font-weight="800">model reality</tspan> — one simulated system at a time.</text>

  <!-- plug line -->
  <text x="60" y="208" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16" fill="#a1a1aa">Core C++ · Memory Management · <tspan fill="#67e8f9" font-weight="700">Discrete-Event Simulation</tspan> · Concurrency</text>

  <!-- divider + traveling pulse -->
  <line x1="60" y1="246" x2="1140" y2="246" stroke="#232b38" stroke-width="1.5"/>
  <circle r="4" fill="url(#gradBrand)" opacity="0">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#dividerPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.08;0.6;0.75" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- research panel -->
  <g>
    <rect x="60" y="270" width="1080" height="118" rx="14" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="88" y="300" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#67e8f9">CURRENTLY RESEARCHING</text>

    <text x="88" y="340" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="21" font-weight="700" fill="#e9edf3" opacity="0">
      Multi-threading in C++ — std::thread &amp; mutexes
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="88" y="340" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="21" font-weight="700" fill="#e9edf3" opacity="0">
      Discrete-Event Simulation — time-stamped event queues
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="88" y="340" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="21" font-weight="700" fill="#e9edf3" opacity="0">
      Heap / Stack memory optimization
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>

    <text x="88" y="368" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">next objective: a reusable discrete-event simulation framework</text>
    <text x="1112" y="300" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#71717a">$ g++ -std=c++20 -O2</text>
  </g>

  <!-- stat chips -->
  <g font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" text-anchor="middle">
    <rect x="60" y="416" width="200" height="52" rx="12" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="160" y="439" font-size="16" font-weight="800" fill="#67e8f9">4</text>
    <text x="160" y="458" font-size="10.5" fill="#a1a1aa">SIMULATION ENGINES</text>

    <rect x="280" y="416" width="200" height="52" rx="12" fill="#161b22" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="380" y="439" font-size="16" font-weight="800" fill="#7ee787">C++17/20</text>
    <text x="380" y="458" font-size="10.5" fill="#a1a1aa">CORE &amp; STL</text>

    <rect x="500" y="416" width="200" height="52" rx="12" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="600" y="439" font-size="16" font-weight="800" fill="#c4b5fd">QUEUEING</text>
    <text x="600" y="458" font-size="10.5" fill="#a1a1aa">THEORY</text>

    <rect x="720" y="416" width="200" height="52" rx="12" fill="#161b22" stroke="#fdcb6e" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="820" y="439" font-size="16" font-weight="800" fill="#fdcb6e">PRIORITY</text>
    <text x="820" y="458" font-size="10.5" fill="#a1a1aa">SCHEDULING</text>

    <rect x="940" y="416" width="200" height="52" rx="12" fill="#161b22" stroke="#f472b6" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="1040" y="439" font-size="16" font-weight="800" fill="#f472b6">CUSTOM</text>
    <text x="1040" y="458" font-size="10.5" fill="#a1a1aa">FILE I/O</text>
  </g>
</svg>

<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulation systems shipped, four core engines built in C++. TurfSync is a scheduling engine for sports turf booking resolving slot conflicts. Embassy Line Sim is a queue-based visa processing simulation surfacing bottlenecks. Hospital Resource Sim is a triage and doctor allocation system driven by dynamic priority queues. UniTracker is an academic performance tracker using custom binary file I/O. Footer: core focus is transforming abstract mathematical models into optimized high performance C++ code.">
  <desc>Animated showcase: each project card has a small looping animation matching its domain — filling booking slots, a moving queue of dots, resorting priority bars, and appearing file records. All titles and descriptions are static and readable on the first frame.</desc>
  <defs>
    <pattern id="gridPaper2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="bgGlow2" cx="80%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#004e92" stop-opacity="0"/>
    </radialGradient>
    <path id="queuePath" d="M 706,204 L 1096,204"/>
  </defs>

  <rect width="1200" height="640" fill="#0b0e14"/>
  <rect width="1200" height="640" fill="url(#gridPaper2)"/>
  <rect width="1200" height="640" fill="url(#bgGlow2)"/>

  <!-- header -->
  <text x="60" y="52" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2.5" font-weight="700" fill="#71717a">SIMULATION SYSTEMS SHIPPED &#183; <tspan fill="#67e8f9">4 CORE ENGINES IN C++</tspan></text>
  <g transform="translate(970, 32)">
    <rect width="170" height="26" rx="13" fill="#161b22" stroke="#22c55e" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="13" r="3.2" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" font-family="Consolas, 'Courier New', monospace" font-size="9.5" letter-spacing="1.2" font-weight="700" fill="#22c55e">ACTIVELY MAINTAINED</text>
  </g>

  <!-- ===== Card 1: TurfSync ===== -->
  <g>
    <rect x="60" y="84" width="540" height="230" rx="14" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="88" y="118" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="20" font-weight="800" fill="#e9edf3">🏟️ TurfSync</text>
    <rect x="88" y="130" width="150" height="20" rx="10" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="163" y="144" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#c4b5fd">SCHEDULING ENGINE</text>
    <text x="88" y="176" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="13.5" fill="#a1a1aa">
      <tspan x="88" dy="0">Sports turf booking engine that resolves</tspan>
      <tspan x="88" dy="18">slot conflicts with constraint-based logic.</tspan>
    </text>
    <!-- animated booking grid -->
    <g transform="translate(88, 214)">
      <!-- 4x3 grid of slots that fill in sequentially -->
      <g id="turfGrid">
        <!-- generated 12 cells -->
      </g>
      <rect x="0" y="0" width="26" height="26" rx="4" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.4"/>
      <rect x="0" y="0" width="26" height="26" rx="4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.02;0.10;0.85;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect>
      <rect x="34" y="0" width="26" height="26" rx="4" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.4"/>
      <rect x="34" y="0" width="26" height="26" rx="4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.02;0.10;0.85;1" dur="6s" begin="0.35s" repeatCount="indefinite"/></rect>
      <rect x="68" y="0" width="26" height="26" rx="4" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.4"/>
      <rect x="68" y="0" width="26" height="26" rx="4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.02;0.10;0.85;1" dur="6s" begin="0.7s" repeatCount="indefinite"/></rect>
      <rect x="102" y="0" width="26" height="26" rx="4" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.4"/>
      <rect x="102" y="0" width="26" height="26" rx="4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.02;0.10;0.85;1" dur="6s" begin="1.05s" repeatCount="indefinite"/></rect>

      <rect x="0" y="34" width="26" height="26" rx="4" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.4"/>
      <rect x="0" y="34" width="26" height="26" rx="4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.02;0.10;0.85;1" dur="6s" begin="1.4s" repeatCount="indefinite"/></rect>
      <rect x="34" y="34" width="26" height="26" rx="4" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.4"/>
      <rect x="34" y="34" width="26" height="26" rx="4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.02;0.10;0.85;1" dur="6s" begin="1.75s" repeatCount="indefinite"/></rect>
      <rect x="68" y="34" width="26" height="26" rx="4" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.4"/>
      <rect x="68" y="34" width="26" height="26" rx="4" fill="#ef4444" opacity="0"><animate attributeName="opacity" values="0;0;0.7;0.7;0" keyTimes="0;0.02;0.10;0.85;1" dur="6s" begin="2.1s" repeatCount="indefinite"/></rect>
      <rect x="102" y="34" width="26" height="26" rx="4" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.4"/>
      <rect x="102" y="34" width="26" height="26" rx="4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.02;0.10;0.85;1" dur="6s" begin="2.45s" repeatCount="indefinite"/></rect>
      <text x="144" y="18" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">booking slots filling &amp; conflicts flagged</text>
    </g>
    <text x="88" y="292" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">github.com/fairuzfaiyaz/TurfSync…</text>
  </g>

  <!-- ===== Card 2: Embassy Line Sim ===== -->
  <g>
    <rect x="620" y="84" width="520" height="230" rx="14" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="648" y="118" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="20" font-weight="800" fill="#e9edf3">🛂 Embassy Line Sim</text>
    <rect x="648" y="130" width="140" height="20" rx="10" fill="#0d2436" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="718" y="144" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7dd3fc">QUEUEING THEORY</text>
    <text x="648" y="176" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="13.5" fill="#a1a1aa">
      <tspan x="648" dy="0">Queue-based simulation of visa processing</tspan>
      <tspan x="648" dy="18">flow, built to surface service bottlenecks.</tspan>
    </text>
    <!-- animated FIFO queue -->
    <g>
      <line x1="648" y1="204" x2="1096" y2="204" stroke="#232b38" stroke-width="1.5"/>
      <rect x="1080" y="192" width="16" height="24" rx="3" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.7"/>
      <circle r="5" fill="#38bdf8">
        <animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#queuePath"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#7dd3fc">
        <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#queuePath"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#0ea5e9">
        <animateMotion dur="3.2s" repeatCount="indefinite" begin="2.2s"><mpath href="#queuePath"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="648" y="232" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">applicants → FIFO queue → service window</text>
    </g>
    <text x="648" y="292" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">github.com/fairuzfaiyaz/Embassy-Consulate…</text>
  </g>

  <!-- ===== Card 3: Hospital Resource Sim ===== -->
  <g>
    <rect x="60" y="334" width="540" height="230" rx="14" fill="#161b22" stroke="#f87171" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="88" y="368" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="20" font-weight="800" fill="#e9edf3">🏥 Hospital Resource Sim</text>
    <rect x="88" y="380" width="150" height="20" rx="10" fill="#2b1414" stroke="#f87171" stroke-opacity="0.5"/>
    <text x="163" y="394" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#fca5a5">PRIORITY LOGIC</text>
    <text x="88" y="426" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="13.5" fill="#a1a1aa">
      <tspan x="88" dy="0">Healthcare resource allocation managing</tspan>
      <tspan x="88" dy="18">doctors and emergency triage priority.</tspan>
    </text>
    <!-- animated priority bars resorting -->
    <g transform="translate(88, 466)">
      <line x1="0" y1="60" x2="240" y2="60" stroke="#232b38" stroke-width="1.5"/>
      <rect x="0" y="30" width="18" height="30" rx="3" fill="#f87171">
        <animate attributeName="height" values="30;54;30;18;30" keyTimes="0;0.25;0.5;0.75;1" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;6;30;42;30" keyTimes="0;0.25;0.5;0.75;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="18" width="18" height="42" rx="3" fill="#fb923c">
        <animate attributeName="height" values="42;24;42;54;42" keyTimes="0;0.25;0.5;0.75;1" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;36;18;6;18" keyTimes="0;0.25;0.5;0.75;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="6" width="18" height="54" rx="3" fill="#fbbf24">
        <animate attributeName="height" values="54;30;54;42;54" keyTimes="0;0.25;0.5;0.75;1" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;30;6;18;6" keyTimes="0;0.25;0.5;0.75;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="90" y="42" width="18" height="18" rx="3" fill="#4b5563">
        <animate attributeName="height" values="18;18;18;24;18" keyTimes="0;0.25;0.5;0.75;1" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="42;42;42;36;42" keyTimes="0;0.25;0.5;0.75;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="130" y="40" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">
        <tspan>patients re-ranked by</tspan>
        <tspan x="130" dy="14">acuity every tick</tspan>
      </text>
    </g>
    <text x="88" y="542" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">github.com/fairuzfaiyaz/Hospital-Resource…</text>
  </g>

  <!-- ===== Card 4: UniTracker ===== -->
  <g>
    <rect x="620" y="334" width="520" height="230" rx="14" fill="#161b22" stroke="#7ee787" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="648" y="368" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="20" font-weight="800" fill="#e9edf3">🎓 UniTracker</text>
    <rect x="648" y="380" width="170" height="20" rx="10" fill="#122316" stroke="#7ee787" stroke-opacity="0.5"/>
    <text x="733" y="394" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#86efac">DATA PERSISTENCE</text>
    <text x="648" y="426" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="13.5" fill="#a1a1aa">
      <tspan x="648" dy="0">Academic performance tracker using custom</tspan>
      <tspan x="648" dy="18">binary file I/O for long-term storage.</tspan>
    </text>
    <!-- animated file/record write -->
    <g transform="translate(648, 466)">
      <rect x="0" y="0" width="150" height="70" rx="6" fill="#0b0e14" stroke="#7ee787" stroke-opacity="0.4"/>
      <rect x="10" y="10" width="90" height="6" rx="3" fill="#22c55e" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="3.2s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="10" y="24" width="110" height="6" rx="3" fill="#22c55e" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.30;1" dur="3.2s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="10" y="38" width="70" height="6" rx="3" fill="#22c55e" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.45;1" dur="3.2s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="10" y="52" width="100" height="6" rx="3" fill="#22c55e" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.62;0.92;0.97;1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="170" y="26" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">
        <tspan x="170" dy="0">records appended</tspan>
        <tspan x="170" dy="14">to disk, run to run</tspan>
      </text>
    </g>
    <text x="648" y="542" font-family="Consolas, monospace" font-size="10.5" fill="#71717a">github.com/fairuzfaiyaz/UNIVERSITY-INFO…</text>
  </g>

  <!-- footer strip -->
  <rect x="60" y="584" width="1080" height="42" rx="12" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="84" y="610" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="13" fill="#c9d1d9">
    <tspan font-weight="700" fill="#67e8f9">Core focus:</tspan> transforming abstract mathematical models into optimized, high-performance C++ code.
  </text>
</svg>

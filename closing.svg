<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Always building. Always simulating. Connect with Fairuz Faiyaz on GitHub and LinkedIn.">
  <desc>Futuristic closing card with animated reveal headline, glowing timeline line, and polished contact chips.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="headlineClip">
      <rect x="0" y="-36" width="0" height="52">
        <animate attributeName="width" values="0;760;760;0;0" keyTimes="0;0.14;0.93;0.985;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="280" fill="#0b0e14"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glowA)"/>
  <rect width="1200" height="280" fill="url(#glowB)"/>

  <g transform="translate(220,64)">
    <text font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#253041">Always building. Always simulating.</text>
    <g clip-path="url(#headlineClip)">
      <text font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#e9edf3">Always building. Always simulating.</text>
    </g>
    <rect x="0" y="-33" width="3.2" height="42" fill="#67e8f9">
      <animate attributeName="x" values="0;760;760;0;0" keyTimes="0;0.14;0.93;0.985;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="600" y="118" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">engineered with precision · optimized with intent · iterated daily</text>

  <line x1="170" y1="136" x2="1030" y2="136" stroke="#232b38" stroke-width="1.6"/>
  <circle r="4" fill="url(#brand)" opacity="0">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M170,136 L1030,136"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.75;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <g transform="translate(300,162)">
      <rect width="180" height="50" rx="25" fill="#161b22" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.55">
        <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <text x="90" y="31" fill="#e9edf3">GitHub</text>
    </g>

    <g transform="translate(510,162)">
      <rect width="180" height="50" rx="25" fill="#161b22" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.55">
        <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <text x="90" y="31" fill="#e9edf3">LinkedIn</text>
    </g>

    <g transform="translate(720,162)">
      <rect width="230" height="50" rx="25" fill="url(#brand)" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.8s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="115" y="31" fill="#0b0e14">Let's connect →</text>
    </g>
  </g>
</svg>

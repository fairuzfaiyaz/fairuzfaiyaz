<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical arsenal. Languages: C++, C sharp, Java, MySQL. Tools and workflow: Git, GitHub, VS Code, Visual Studio. Platforms and docs: Windows, PowerShell, Markdown.">
  <desc>Animated panel: each chip's border gently pulses on a staggered loop and a soft scan line sweeps across the row. All labels are fully visible and readable on the first frame.</desc>
  <defs>
    <pattern id="a_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="a_glow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#004e92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a_sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="#0b0e14"/>
  <rect width="1200" height="380" fill="url(#a_grid)"/>
  <rect width="1200" height="380" fill="url(#a_glow)"/>

  <text x="60" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.5" fill="#67e8f9">TECHNICAL ARSENAL</text>
  <text x="1140" y="52" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.5" fill="#71717a">LANGUAGES · TOOLS · PLATFORMS</text>
  <line x1="60" y1="66" x2="1140" y2="66" stroke="#232b38" stroke-width="1.5"/>

  <!-- sweeping light across the whole row -->
  <rect x="-260" y="66" width="260" height="290" fill="url(#a_sweep)">
    <animate attributeName="x" values="-260;1200" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Panel 1: Languages ===== -->
  <g>
    <rect x="60" y="96" width="340" height="252" rx="14" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="86" y="130" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16" font-weight="800" fill="#e9edf3">⚙ Languages</text>
    <line x1="86" y1="142" x2="374" y2="142" stroke="#22d3ee" stroke-opacity="0.25"/>

    <g font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" font-weight="600">
      <g transform="translate(86,166)">
        <rect width="228" height="34" rx="8" fill="#0d2436" stroke="#22d3ee" stroke-opacity="0.55">
          <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="2.6s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#67e8f9">C++ — primary language</text>
      </g>
      <g transform="translate(86,208)">
        <rect width="228" height="34" rx="8" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#c9d1d9">C#</text>
      </g>
      <g transform="translate(86,250)">
        <rect width="228" height="34" rx="8" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#c9d1d9">Java</text>
      </g>
      <g transform="translate(86,292)">
        <rect width="228" height="34" rx="8" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#c9d1d9">MySQL</text>
      </g>
    </g>
  </g>

  <!-- ===== Panel 2: Tools & Workflow ===== -->
  <g>
    <rect x="430" y="96" width="340" height="252" rx="14" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="456" y="130" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16" font-weight="800" fill="#e9edf3">🧩 Tools &amp; Workflow</text>
    <line x1="456" y1="142" x2="744" y2="142" stroke="#a78bfa" stroke-opacity="0.25"/>

    <g font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" font-weight="600">
      <g transform="translate(456,166)">
        <rect width="228" height="34" rx="8" fill="#211a3d" stroke="#a78bfa" stroke-opacity="0.55">
          <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="2.6s" begin="0.2s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#c4b5fd">Git &amp; GitHub</text>
      </g>
      <g transform="translate(456,208)">
        <rect width="228" height="34" rx="8" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#c9d1d9">Visual Studio Code</text>
      </g>
      <g transform="translate(456,250)">
        <rect width="228" height="34" rx="8" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="2.6s" begin="1.0s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#c9d1d9">Visual Studio</text>
      </g>
    </g>
  </g>

  <!-- ===== Panel 3: Platforms & Docs ===== -->
  <g>
    <rect x="800" y="96" width="340" height="252" rx="14" fill="#161b22" stroke="#7ee787" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="826" y="130" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16" font-weight="800" fill="#e9edf3">🖥 Platforms &amp; Docs</text>
    <line x1="826" y1="142" x2="1114" y2="142" stroke="#7ee787" stroke-opacity="0.25"/>

    <g font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" font-weight="600">
      <g transform="translate(826,166)">
        <rect width="228" height="34" rx="8" fill="#122316" stroke="#7ee787" stroke-opacity="0.55">
          <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="2.6s" begin="0.35s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#86efac">Windows</text>
      </g>
      <g transform="translate(826,208)">
        <rect width="228" height="34" rx="8" fill="#161b22" stroke="#7ee787" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="2.6s" begin="0.75s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#c9d1d9">PowerShell</text>
      </g>
      <g transform="translate(826,250)">
        <rect width="228" height="34" rx="8" fill="#161b22" stroke="#7ee787" stroke-opacity="0.4">
          <animate attributeName="stroke-opacity" values="0.25;0.7;0.25" dur="2.6s" begin="1.15s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="22" fill="#c9d1d9">Markdown</text>
      </g>
    </g>
  </g>
</svg>
